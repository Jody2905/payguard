[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "payguard"
version = "1.0.0"
description = "Finds duplicate, split and suspicious payments in accounts-payable data, with explanations an auditor can act on."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jody-Ann Trimmingham" }]
dependencies = [
  "pandas>=2.2",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "rapidfuzz>=3.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.30", "plotly>=5.0"]
dev = ["pytest>=7"]

[project.scripts]
payguard = "payguard.cli:main"

[tool.setuptools.packages.find]
include = ["payguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
